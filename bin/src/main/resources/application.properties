spring.application.name=baozi-store

# ===== Banco de dados: MySQL (padrão) =====
# O banco "baozi_store" é criado automaticamente se não existir.
# Ajuste usuário e senha para os do seu MySQL.
spring.datasource.url=jdbc:mysql://localhost:3306/baozi_store?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo
spring.datasource.username=root
spring.datasource.password=root

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===== Respostas de erro com mensagem =====
server.error.include-message=always
server.port=8080
